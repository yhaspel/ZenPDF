# ZenPDF web on Railway — derived from frontend/nginx.conf (keep CSP/cache
# blocks in sync with it). Deltas: Railway private-DNS resolver + variable
# upstream, X-Forwarded-Proto pinned to https (edge terminates TLS),
# /health for Railway's deploy healthcheck, rewrite-based /ads.txt proxy.

server {
    # `default_server` is marked explicitly, and it matters (phase-11 §11A).
    # `server_name _` matches nothing; this block works only because it is the
    # sole server and nginx therefore treats it as the default. The moment the
    # commented-out redirect block at the end of this file is enabled there are
    # two servers, and whichever is default catches every Host that matches no
    # `server_name` — including Railway's own healthcheck Host. Marking it here
    # means the answer does not depend on block order.
    listen 80 default_server;
    server_name _;
    client_max_body_size 120m;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Railway's edge terminates TLS and speaks plain HTTP to this container, so
    # $scheme is "http" here. nginx builds its own redirects (notably the 301
    # from /merge-pdf to the prerendered /merge-pdf/ directory) from $scheme +
    # $host, which would hand browsers an http:// Location and downgrade the
    # first visit to any directory-style route. Relative redirects inherit the
    # browser's https origin instead.
    absolute_redirect off;

    resolver [fd12::10] ipv6=on valid=1s;
    set $api_upstream http://api.railway.internal:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header X-Download-Options "noopen" always;
        # Added 2026-08-23 — see frontend/nginx.conf, and keep the two in step.
        # The server-level Permissions-Policy at the top of this file does not
        # survive into a location that calls `add_header` at all, so `/api/` was
        # serving six of seven. Measured on production, not inferred.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 30 always;
        # `add_header` replaces the inherited set — see frontend/nginx.conf, and
        # keep the two in step. Without these seven this 503 was the one API
        # response served with no CSP, HSTS, `nosniff` or `frame-ancestors`.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header X-Download-Options "noopen" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        return 503 '{"error":{"code":"upstream_unavailable","message":"ZenPDF is not answering right now. Nothing you have saved is affected.","details":{}}}';
    }

    location = /ads.txt {
        rewrite ^ /api/ads.txt break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # pdf.js ships as ES modules (`viewer-*.mjs`, `pdf.worker-*.mjs`) and a
    # WebAssembly blob. nginx's stock mime.types knows neither extension, so
    # both were served as `application/octet-stream` — and with
    # `X-Content-Type-Options: nosniff` (rightly) set, Chrome refuses to
    # execute a module script or stream-compile a wasm module with the wrong
    # type. That is why the workspace viewer never fetched a document in
    # production and failed silently. An empty `types {}` plus `default_type`
    # pins the answer regardless of what the base image's map contains.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    # The routes that legitimately exist but are **client**-rendered
    # (app.routes.server.ts): they have no prerendered file, so they can only be
    # answered with the shell — and they must answer 200, because they are real
    # pages. Listed explicitly rather than swept up by the catch-all, which is
    # what let every unknown URL answer 200 with the landing page (a soft 404:
    # indexable, and it hides typos in links from anyone watching logs).
    # Declared after the asset regex so a request for a file still wins.
    location ~ ^/(app(/|$)|s/[^/]+|auth/(login|register)/?$|unsubscribe/[^/]+|verify-email/[^/]+|verify/?$) {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        root /usr/share/nginx/html;
    }

    location / {
        # `$uri/index.html` ahead of `$uri/`: the bare `$uri/` form makes nginx
        # spot a directory and 301 the trailing slash on, so every prerendered
        # route in sitemap.xml cost a redirect hop and resolved at a URL that
        # was not the one its own canonical named. Naming the index file serves
        # /merge-pdf directly with a 200; /merge-pdf/ still works via the
        # directory match that follows.
        try_files $uri $uri/index.html $uri/ =404;
        # A genuine miss still gets the app shell — the router renders the same
        # "not found" page a person expects — but with a 404 status, so a
        # crawler is told the truth instead of indexing the landing page under
        # a hundred wrong URLs. `error_page` keeps the original 404 code; only
        # an explicit `=200` would change it.
        error_page 404 /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }
}

# ---------------------------------------------------------------------------
# Domain cutover (phase-11 §11A) — COMMENTED OUT UNTIL THE DOMAIN EXISTS.
#
# Uncomment, replace <apex> with the real apex domain, and push. The full
# procedure — including the Railway env sweep this file cannot do — is in
# `docs/ops/domain-cutover.md`. Change `SITE_URL` in the same commit or the
# canonicals will name the old host while the old host redirects away from
# itself.
#
# ⚠ ORDER IS LOAD-BEARING. This block must stay **after** the server block
#   above, and that block must keep `listen 80 default_server;`. Put this one
#   first, or leave `default_server` implicit, and nginx makes *this* the
#   default server: the apex Host then matches no `server_name` here (it is
#   the redirect target, not a listed name), falls through to the default,
#   and production 301-loops. Railway's healthcheck sends its own Host to
#   `location = /health`, so it would 301 too — and every deploy would fail.
#
# ⚠ The URL is written out absolutely on purpose. `$scheme` is `http` inside
#   this container because Railway's edge terminates TLS, so `$scheme://`
#   would redirect https traffic down to http. That is the same trap
#   `absolute_redirect off` fixes for directory redirects above.
#
# server {
#     listen 80;
#     server_name zenpdf.up.railway.app www.<apex>;
#     return 301 https://<apex>$request_uri;
# }
