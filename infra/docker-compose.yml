# ZenPDF local dev stack (01-architecture.md §5). Run via infra/up.sh.
name: zenpdf

x-api-env: &api-env
  env_file: .env

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zen}
      POSTGRES_DB: ${POSTGRES_DB:-zenpdf}
    volumes:
      # postgres:18+ stores data under a version subdir of /var/lib/postgresql
      # (mounting at /data is rejected by the image's safety check).
      - pgdata:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zen} -d ${POSTGRES_DB:-zenpdf}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: chrislusf/seaweedfs:3.97
    command: server -s3 -dir=/data -s3.config=/etc/seaweedfs/s3-config.json -ip.bind=0.0.0.0
    volumes:
      - seaweed-data:/data
      - ./seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    ports:
      - "${STORAGE_PORT:-8333}:8333"

  gotenberg:
    image: gotenberg/gotenberg:8
    # A hostile document can still exhaust LibreOffice's memory inside its own
    # container even with the upload guard in front (§10.1) — so it comes back
    # by itself rather than staying dead until somebody notices conversions
    # have stopped.
    restart: unless-stopped
    mem_limit: 2g
    command:
      - gotenberg
      # JavaScript stays off: we render documents and web pages, not
      # applications, and it is the largest single piece of attack surface in
      # the container that fetches URLs on a user's behalf.
      - --chromium-disable-javascript=true
      # Layer 2 of the SSRF guard (§17, phase-06). `apps/core/urlguard.py` is
      # layer 1 and checks the URL a user typed; this is what covers the hops it
      # cannot see — a redirect into the private space, and a name that resolves
      # publicly when we check it and privately when Chromium connects, because
      # the deny-list is evaluated on *every navigation*.
      #
      # Kept in step with `urlguard.INTERNAL_HOSTS` and the private ranges by
      # `apps/core/tests/test_urlguard.py::test_gotenberg_denies_what_layer_one_denies`.
      # The literal is the fallback on purpose: `.env` files predate this
      # setting on existing machines, and `${VAR}` alone would have passed an
      # *empty* deny-list — silently turning layer 2 off on exactly the boxes
      # that have been running longest.
      - --chromium-deny-list=${GOTENBERG_DENY_LIST:-^file:(?!//\/tmp/).*|^[a-z]+://(?:[^/@]*@)?(localhost|127\.\d+(\.\d+)?(\.\d+)?|0\.0\.0\.0|0x[0-9a-f]+|0\d+(\.\d+)?(\.\d+)?(\.\d+)?|\d\d\d\d\d\d\d\d\d?\d?|\[?::1\]?|\[?::ffff:.*|\[?0:0:0:0:0:(0|ffff):.*|\[?fd[0-9a-f][0-9a-f]:.*|\[?fe80:.*|169\.254\.\d+\.\d+|10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+|100\.100\.200\.200|metadata\.google\.internal|metadata\.goog|.*\.internal|api|web|db|redis|storage|mailpit|gotenberg|beat|worker-default|worker-heavy|worker-render)\.?([:/].*)?$$}

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  api:
    build:
      context: ../backend
      dockerfile: ../infra/docker/api.Dockerfile
      target: dev
    <<: *api-env
    volumes:
      - ../backend:/app
      - ./certs:/certs:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker-default:
    # Without a container ceiling the OOM killer chooses its victim across
    # the whole VM, so a runaway operation can take Postgres down instead of
    # its own child. `--max-memory-per-child` retires a child *after* a task;
    # this is what bounds one that allocates during it.
    # lane memory ceiling (default)
    mem_limit: 2g
    build:
      context: ../backend
      dockerfile: ../infra/docker/api.Dockerfile
      target: dev
    <<: *api-env
    command: celery -A config worker -Q default -c 4 -n default@%h --max-memory-per-child 1500000 --time-limit 120 --soft-time-limit 60
    volumes:
      - ../backend:/app
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started

  worker-heavy:
    # Without a container ceiling the OOM killer chooses its victim across
    # the whole VM, so a runaway operation can take Postgres down instead of
    # its own child. `--max-memory-per-child` retires a child *after* a task;
    # this is what bounds one that allocates during it.
    # lane memory ceiling (heavy)
    mem_limit: 2g
    build:
      context: ../backend
      dockerfile: ../infra/docker/api.Dockerfile
      target: dev
    <<: *api-env
    command: celery -A config worker -Q heavy -c 2 -n heavy@%h --max-memory-per-child 1500000 --time-limit 900 --soft-time-limit 600
    volumes:
      - ../backend:/app
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started

  worker-render:
    # Without a container ceiling the OOM killer chooses its victim across
    # the whole VM, so a runaway operation can take Postgres down instead of
    # its own child. `--max-memory-per-child` retires a child *after* a task;
    # this is what bounds one that allocates during it.
    # lane memory ceiling (render)
    mem_limit: 2g
    build:
      context: ../backend
      dockerfile: ../infra/docker/api.Dockerfile
      target: dev
    <<: *api-env
    command: celery -A config worker -Q render -c 4 -n render@%h --max-memory-per-child 1500000 --time-limit 60 --soft-time-limit 30
    volumes:
      - ../backend:/app
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started

  beat:
    build:
      context: ../backend
      dockerfile: ../infra/docker/api.Dockerfile
      target: dev
    <<: *api-env
    command: celery -A config beat -l info
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      dockerfile: ../infra/docker/web.Dockerfile
      target: dev
    # The esbuild dev-server + pdf.js can spike memory; auto-recover if OOM-killed.
    restart: unless-stopped
    # No --poll: on Docker Desktop mounts the poll watcher fires spurious rebuilds
    # that deadlock the esbuild+Tailwind pipeline. The server compiles once and
    # serves stably (hot-reload via mount is a Mac-only dev nicety, not required).
    command: npm start -- --host 0.0.0.0 --proxy-config proxy.conf.json
    volumes:
      - ../frontend:/app
      - web-node-modules:/app/node_modules
    ports:
      - "${WEB_PORT:-4200}:4200"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  seaweed-data:
  web-node-modules:
