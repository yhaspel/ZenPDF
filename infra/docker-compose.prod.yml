# ZenPDF prod-shaped stack (01-architecture.md §5). Railway deploy is phase 10.
# Same images, prod targets: nginx web, gunicorn api, workers, beat.
name: zenpdf-prod

x-api-env: &api-env
  env_file: .env.prod

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zen}
      POSTGRES_DB: ${POSTGRES_DB:-zenpdf}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zen} -d ${POSTGRES_DB:-zenpdf}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine

  storage:
    image: chrislusf/seaweedfs:3.97
    command: server -s3 -dir=/data -s3.config=/etc/seaweedfs/s3-config.json -ip.bind=0.0.0.0
    volumes:
      - seaweed-data:/data
      - ./seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro

  gotenberg:
    image: gotenberg/gotenberg:8
    # A hostile document can still exhaust LibreOffice's memory inside its own
    # container even with the upload guard in front (§10.1) — so it comes back
    # by itself rather than staying dead until somebody notices conversions
    # have stopped.
    restart: unless-stopped
    mem_limit: 2g
    # Production ran this with no flags at all, which was harmless while nothing
    # asked Chromium to fetch a URL. Phase 6 does, so the same two hardening
    # flags the dev stack uses belong here — more so, since this container sits
    # inside the production network (§17).
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-deny-list=${GOTENBERG_DENY_LIST:-^file:(?!//\/tmp/).*|^[a-z]+://(?:[^/@]*@)?(localhost|127\.\d+(\.\d+)?(\.\d+)?|0\.0\.0\.0|0x[0-9a-f]+|0\d+(\.\d+)?(\.\d+)?(\.\d+)?|\d\d\d\d\d\d\d\d\d?\d?|\[?::1\]?|\[?::ffff:.*|\[?0:0:0:0:0:(0|ffff):.*|\[?fd[0-9a-f][0-9a-f]:.*|\[?fe80:.*|169\.254\.\d+\.\d+|10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+|100\.100\.200\.200|metadata\.google\.internal|metadata\.goog|.*\.internal|api|web|db|redis|storage|mailpit|gotenberg|beat|worker-default|worker-heavy|worker-render)\.?([:/].*)?$$}

  api:
    build:
      context: ../backend
      dockerfile: ../infra/docker/api.Dockerfile
      target: prod
    <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker-default:
    # Without a container ceiling the OOM killer chooses its victim across
    # the whole VM, so a runaway operation can take Postgres down instead of
    # its own child. `--max-memory-per-child` retires a child *after* a task;
    # this is what bounds one that allocates during it.
    # lane memory ceiling (default)
    mem_limit: 2g
    build:
      context: ../backend
      dockerfile: ../infra/docker/api.Dockerfile
      target: prod
    <<: *api-env
    command: celery -A config worker -Q default -c 4 --max-memory-per-child 1500000 --time-limit 120 --soft-time-limit 60
    depends_on:
      - db
      - redis

  worker-heavy:
    # Without a container ceiling the OOM killer chooses its victim across
    # the whole VM, so a runaway operation can take Postgres down instead of
    # its own child. `--max-memory-per-child` retires a child *after* a task;
    # this is what bounds one that allocates during it.
    # lane memory ceiling (heavy)
    mem_limit: 2g
    build:
      context: ../backend
      dockerfile: ../infra/docker/api.Dockerfile
      target: prod
    <<: *api-env
    command: celery -A config worker -Q heavy -c 2 --max-memory-per-child 1500000 --time-limit 900 --soft-time-limit 600
    depends_on:
      - db
      - redis

  worker-render:
    # Without a container ceiling the OOM killer chooses its victim across
    # the whole VM, so a runaway operation can take Postgres down instead of
    # its own child. `--max-memory-per-child` retires a child *after* a task;
    # this is what bounds one that allocates during it.
    # lane memory ceiling (render)
    mem_limit: 2g
    build:
      context: ../backend
      dockerfile: ../infra/docker/api.Dockerfile
      target: prod
    <<: *api-env
    command: celery -A config worker -Q render -c 4 --max-memory-per-child 1500000 --time-limit 60 --soft-time-limit 30
    depends_on:
      - db
      - redis

  beat:
    build:
      context: ../backend
      dockerfile: ../infra/docker/api.Dockerfile
      target: prod
    <<: *api-env
    command: celery -A config beat -l info
    depends_on:
      - db
      - redis

  web:
    build:
      context: ../frontend
      dockerfile: ../infra/docker/web.Dockerfile
      target: prod
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
  seaweed-data:
