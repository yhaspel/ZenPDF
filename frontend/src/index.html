<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ZenPDF — every PDF tool, free and without an account</title>
  <meta name="description"
        content="Merge, split, compress, sign, OCR and convert PDFs in your browser. Free, no watermark, no account needed, and files are deleted automatically.">
  <!-- Both emitted with media attrs so prerendered pages are right before any
       script runs; the theme service swaps both when a mode is forced. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F1E6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171310">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preload" href="/fonts/zen-kaku-gothic-new-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/zen-kaku-gothic-new-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/shippori-mincho-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- FOUC prevention (design contract §5): resolve the stored theme before the
       first paint of a prerendered page. Must stay ahead of the stylesheets and
       mirror ThemeService's logic exactly.
       A file, not an inline block: production's CSP is `script-src 'self'
       'wasm-unsafe-eval'`, which refuses inline script, so inlining this meant
       the theme was never applied before hydration. Classic and non-deferred,
       so it still runs before first paint. -->
  <script src="/theme-boot.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
