# Prod nginx: serve the SPA, proxy /api to gunicorn (skill convention).
# Security headers / CSP are hardened in phase 10.
server {
    listen 80;
    server_name _;
    client_max_body_size 120m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Stream PDF ranges without buffering the whole body.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ads.txt must answer at the site root for the crawler to accept it, but
    # its contents come from the publisher id in the environment (§9A) — so it
    # is the API that renders it, not a file baked into the image.
    location = /ads.txt {
        proxy_pass http://api:8000/api/ads.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # CSP is activated in phase 10. When it is, the ad layer needs these hosts,
    # and only these — nothing else in the product loads third-party code:
    #   script-src  https://pagead2.googlesyndication.com
    #               https://fundingchoicesmessages.google.com
    #   frame-src   https://googleads.g.doubleclick.net https://tpc.googlesyndication.com
    #   img-src     https://pagead2.googlesyndication.com data:
    #   connect-src https://pagead2.googlesyndication.com
    # With ADS_ENABLED=false none of them are contacted, so the strict policy
    # can ship first and these are added the day ads are turned on.
}
