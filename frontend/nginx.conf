# Prod nginx: serve the SPA, proxy /api to gunicorn, and set the headers a
# document product has to set (01-architecture.md §17, phase-10 §10.1).
#
# The CSP below is the **ads-off** policy, which is the shipped default. Turning
# ads on needs the four commented hosts added — they are written out rather than
# left to be rediscovered, and `docs/09-adsense-readiness.md` points here.
#
# Two entries that look odd and are not:
#   * `worker-src blob:` — PDF.js runs its parser in a worker created from a
#     blob URL. Without it the viewer silently renders nothing.
#   * `wasm-unsafe-eval` — PDF.js's OpenJPEG (JPEG 2000) decoder is WebAssembly.
#     It is the narrow modern token, not `unsafe-eval`; dropping it breaks
#     exactly those images and nothing else, so it can be removed by anyone
#     willing to accept that.
#
# COOP/COEP are **not** set. Cross-origin isolation would break the ad iframes
# the product is funded by, and buys nothing here: no SharedArrayBuffer, no
# high-resolution timers. Decision recorded rather than silently skipped.

server {
    listen 80;
    server_name _;
    client_max_body_size 120m;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version to somebody deciding whether to bother.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # HSTS: only meaningful over TLS, and the TLS terminator is the reverse
    # proxy in front of this. Two years, subdomains included; add `preload`
    # only when the owner is ready to be on the preload list for good.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
    # Nothing in this product needs a camera, a microphone or a location.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Stream PDF ranges without buffering the whole body.
        proxy_buffering off;
        proxy_request_buffering off;

        # `add_header` in a nested block replaces the parent's set, so the
        # security headers are repeated here rather than silently dropped on
        # every API response — which is where user content is served from.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        # User content, so the page-embedding policy is the strict one and the
        # document is never a page in its own right.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header X-Download-Options "noopen" always;
    }

    # ads.txt must answer at the site root for the crawler to accept it, but
    # its contents come from the publisher id in the environment (§9A) — so it
    # is the API that renders it, not a file baked into the image.
    location = /ads.txt {
        proxy_pass http://api:8000/api/ads.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output: immutable, so a returning visitor pays for nothing
    # they already have. `index.html` is deliberately *not* in here.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Upstream down: a static page rather than nginx's default, and only for
    # the SPA — an API client is better served by the proxy's own status than
    # by a page of HTML it cannot parse.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        root /usr/share/nginx/html;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # The shell must never be cached, or a deploy leaves returning visitors
        # on yesterday's chunk names and a blank page.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }
}

