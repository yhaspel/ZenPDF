# Prod nginx: serve the SPA, proxy /api to gunicorn, and set the headers a
# document product has to set (01-architecture.md §17, phase-10 §10.1).
#
# The CSP below is the **ads-off** policy, which is the shipped default. Turning
# ads on needs the four commented hosts added — they are written out rather than
# left to be rediscovered, and `docs/09-adsense-readiness.md` points here.
#
# Two entries that look odd and are not:
#   * `worker-src blob:` — PDF.js runs its parser in a worker created from a
#     blob URL. Without it the viewer silently renders nothing.
#   * `wasm-unsafe-eval` — PDF.js's OpenJPEG (JPEG 2000) decoder is WebAssembly.
#     It is the narrow modern token, not `unsafe-eval`; dropping it breaks
#     exactly those images and nothing else, so it can be removed by anyone
#     willing to accept that.
#
# COEP is **not** set, and COOP is left to Django (which sends `same-origin` on
# API responses). Full cross-origin isolation would break the ad iframes the
# product is funded by, and buys nothing here: no SharedArrayBuffer, no
# high-resolution timers. Decision recorded rather than silently skipped.

server {
    listen 80;
    server_name _;
    client_max_body_size 120m;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version to somebody deciding whether to bother.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # HSTS: only meaningful over TLS, and the TLS terminator is the reverse
    # proxy in front of this. Two years, subdomains included; add `preload`
    # only when the owner is ready to be on the preload list for good.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
    # Nothing in this product needs a camera, a microphone or a location.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Client identity for every per-IP rate limit is derived from the tail of
    # X-Forwarded-For, counting back `NUM_PROXIES` hops (config/settings/base.py).
    # This block appends its own upstream hop, so the reference topology —
    # client → TLS terminator → nginx → gunicorn — needs `NUM_PROXIES=2`.
    #
    # The alternative is to normalize here instead, and keep `NUM_PROXIES=1`:
    # uncomment the three lines below with the terminator's real CIDR, and nginx
    # rewrites $remote_addr (and the header it forwards) to the client address.
    # Only ever trust a CIDR you control — `set_real_ip_from 0.0.0.0/0` hands
    # every client the ability to pick their own rate-limit bucket.
    #
    #   set_real_ip_from  <terminator-CIDR>;   # e.g. 10.0.0.0/8, or the LB subnet
    #   real_ip_header    X-Forwarded-For;
    #   real_ip_recursive on;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Stream PDF ranges without buffering the whole body.
        proxy_buffering off;
        proxy_request_buffering off;

        # `add_header` in a nested block replaces the parent's set, so the
        # security headers are repeated here rather than silently dropped on
        # every API response — which is where user content is served from.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        # User content, so the page-embedding policy is the strict one and the
        # document is never a page in its own right.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header X-Download-Options "noopen" always;

        # An API client gets JSON when the upstream is down, in the same shape
        # as every other error (§6). Without this it receives the HTML holding
        # page, which is unparseable to the SPA and to anything else.
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 30 always;
        # The whole set again, and for the reason stated in `/api/` above:
        # `add_header` in a nested block **replaces** the inherited set rather
        # than extending it. This location added only `Retry-After`, so the one
        # response the SPA sees when the API is down was the one response with
        # no CSP, no HSTS, no `nosniff` and no `frame-ancestors` on it. The
        # Phase-10 "Security headers" row says the set is repeated per location
        # *because* of that replace rule; this is the location where the
        # reasoning had not been applied.
        #
        # The `/api/` policy, not the SPA one: this body is an API response, and
        # `default-src 'none'; sandbox` is the right answer for a JSON error
        # somebody could otherwise navigate to.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header X-Download-Options "noopen" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        return 503 '{"error":{"code":"upstream_unavailable","message":"ZenPDF is not answering right now. Nothing you have saved is affected.","details":{}}}';
    }

    # ads.txt must answer at the site root for the crawler to accept it, but
    # its contents come from the publisher id in the environment (§9A) — so it
    # is the API that renders it, not a file baked into the image.
    location = /ads.txt {
        proxy_pass http://api:8000/api/ads.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # pdf.js ships as ES modules (`viewer-*.mjs`, `pdf.worker-*.mjs`) and a
    # WebAssembly blob. nginx's stock mime.types knows neither extension, so
    # both were served as `application/octet-stream` — and with
    # `X-Content-Type-Options: nosniff` (rightly) set, Chrome refuses to
    # execute a module script or stream-compile a wasm module with the wrong
    # type. That is why the workspace viewer never fetched a document in
    # production and failed silently. An empty `types {}` plus `default_type`
    # pins the answer regardless of what the base image's map contains.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    # Hashed build output: immutable, so a returning visitor pays for nothing
    # they already have. `index.html` is deliberately *not* in here.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        # `expires` already emits Cache-Control; adding another here would send
        # the header twice, which is legal and confusing.
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # The whole set again — `add_header` *replaces* the parent's rather
        # than adding to it, and this block serves the majority of responses.
        # An `.svg` navigated to directly is a document, and one with no CSP.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    # Routes that exist but are client-rendered (app.routes.server.ts) have no
    # prerendered file, so the shell is the only possible answer — and it must
    # be a 200, because they are real pages. Everything *not* listed here is a
    # genuine miss. Kept in step with nginx.railway.conf.
    location ~ ^/(app(/|$)|s/[^/]+|auth/(login|register)/?$|unsubscribe/[^/]+|verify-email/[^/]+|verify/?$) {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # Upstream down. The SPA gets the holding page; `/api/` gets JSON, from the
    # named location above — nginx generates the 502 itself, so without that
    # split *every* failed XHR would receive a page of HTML.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        root /usr/share/nginx/html;
    }

    location / {
        # `$uri/index.html` ahead of `$uri/` — see nginx.railway.conf: the bare
        # directory form 301s a trailing slash onto every prerendered route, so
        # each sitemap URL redirected and landed somewhere its canonical did
        # not name. Kept in step with the Railway config deliberately.
        try_files $uri $uri/index.html $uri/ =404;
        # A genuine miss gets the shell (so the router shows the real "not
        # found" page) but with a 404 status — `error_page` preserves the
        # original code unless an explicit `=200` overrides it. Previously the
        # fallback was a bare `/index.html`, so every unknown URL answered 200
        # with the landing page.
        error_page 404 /index.html;
        # The shell must never be cached, or a deploy leaves returning visitors
        # on yesterday's chunk names and a blank page.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }
}

