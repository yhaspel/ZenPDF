<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace · Annotate — ZenPDF (dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#171310">
<style>
/* ZenPDF — "Zen ink & paper" design tokens + component layer.
   Source of truth: handoff/design-instructions.md. Semantic tokens only in components. */

/* ---------- 1. Primitives + semantic aliases (light) ---------- */
:root {
  /* paper */
  --paper-0:#FFFDF7; --paper-50:#FBF8F1; --paper-100:#F5F1E6; --paper-200:#EDE7D8;
  --paper-300:#E3DBC8; --paper-400:#C6BBA1;
  /* ink */
  --ink-900:#211C15; --ink-800:#332D24; --ink-700:#4A4337; --ink-600:#5F574A;
  --ink-500:#776E5E; --ink-400:#948A77;
  /* night paper */
  --night-900:#171310; --night-800:#1E1915; --night-700:#26201A; --night-600:#362F26; --night-500:#4A4234;
  /* vermilion (the seal) */
  --verm-700:#7E2717; --verm-600:#96301F; --verm-500:#B23A26; --verm-400:#D96A50; --verm-300:#E98B72;
  /* status primitives */
  --pine-600:#2F6B46; --pine-300:#8CC3A0;
  --ochre-600:#8A6212; --ochre-300:#D8B25E;
  --crimson-600:#8E2A38; --crimson-300:#E08296;
  --water-600:#3D6478; --water-300:#9CC0D4;

  /* semantic — light ("day paper") */
  --color-bg:var(--paper-100);
  --color-surface:var(--paper-50);
  --color-surface-raised:var(--paper-0);
  --color-ink:var(--ink-800);
  --color-ink-strong:var(--ink-900);
  --color-ink-muted:var(--ink-600);
  --color-ink-faint:var(--ink-400);
  --color-accent:var(--verm-500);
  --color-accent-hover:var(--verm-600);
  --color-accent-active:var(--verm-700);
  --color-on-accent:var(--paper-0);
  --color-accent-surface:#F6E4DD;
  --color-border:var(--paper-300);
  --color-border-strong:var(--paper-400);
  --color-focus:var(--verm-500);
  --color-success:var(--pine-600);       --color-success-surface:#E6EEE2;
  --color-warning:var(--ochre-600);      --color-warning-surface:#F3EAD2;
  --color-danger:var(--crimson-600);     --color-danger-surface:#F3E0E0;
  --color-info:var(--water-600);         --color-info-surface:#E2EAEE;
  --color-canvas-backdrop:#E9E2D0;
  --color-page-shadow:rgba(60,50,30,.18);
  --color-ad-frame:var(--paper-200);
  --color-scrim:rgba(33,28,21,.45);

  /* type */
  --font-display:"Shippori Mincho", Georgia, "Times New Roman", serif;
  --font-ui:"Zen Kaku Gothic New", -apple-system, "Segoe UI", system-ui, sans-serif;

  /* rhythm */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
  --space-6:32px; --space-7:48px; --space-8:64px; --space-9:96px;
  --radius-1:4px; --radius-2:6px; --radius-3:10px;
  --border-hairline:1px; --border-emphasis:2px;
  --shadow-1:0 1px 2px rgba(50,40,25,.06);
  --shadow-2:0 2px 8px rgba(50,40,25,.10);
  --shadow-3:0 8px 28px rgba(50,40,25,.16);
  --dur-1:150ms; --dur-2:220ms; --dur-3:300ms;
  --ease:cubic-bezier(.4,0,.2,1);
}
.dark {
  --color-bg:var(--night-900);
  --color-surface:var(--night-800);
  --color-surface-raised:var(--night-700);
  --color-ink:#EFE8DA;
  --color-ink-strong:#F8F3E7;
  --color-ink-muted:#BDB29E;
  --color-ink-faint:#8E8471;
  --color-accent:var(--verm-400);
  --color-accent-hover:var(--verm-300);
  --color-accent-active:#F2A992;
  --color-on-accent:var(--night-900);
  --color-accent-surface:#3B241C;
  --color-border:var(--night-600);
  --color-border-strong:var(--night-500);
  --color-focus:var(--verm-400);
  --color-success:var(--pine-300);   --color-success-surface:#22301F;
  --color-warning:var(--ochre-300);  --color-warning-surface:#332A14;
  --color-danger:var(--crimson-300); --color-danger-surface:#38202A;
  --color-info:var(--water-300);     --color-info-surface:#1D2B33;
  --color-canvas-backdrop:#121009;
  --color-page-shadow:rgba(0,0,0,.55);
  --color-ad-frame:#231E18;
  --color-scrim:rgba(0,0,0,.6);
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 8px rgba(0,0,0,.45);
  --shadow-3:0 8px 28px rgba(0,0,0,.55);
}

/* ---------- 2. Base ---------- */
* { box-sizing:border-box; margin:0; }
html,body { height:100%; }
body {
  background:var(--color-bg); color:var(--color-ink);
  font:400 15px/1.6 var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display { font-family:var(--font-display); color:var(--color-ink-strong); font-weight:600; line-height:1.25; text-wrap:pretty; }
h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}
a { color:var(--color-ink); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--color-border-strong); }
a:hover { color:var(--color-accent-hover); text-decoration-color:currentColor; }
:focus-visible { outline:2px solid var(--color-focus); outline-offset:2px; border-radius:2px; }
::selection { background:var(--color-accent-surface); }
small,.muted { color:var(--color-ink-muted); }
.faint { color:var(--color-ink-faint); }
.kicker { font:500 11px/1.4 var(--font-ui); letter-spacing:.14em; text-transform:uppercase; color:var(--color-ink-faint); }

/* ---------- 3. Brand ---------- */
.brand { display:inline-flex; align-items:center; gap:10px; text-decoration:none; }
.brand:hover { color:inherit; }
.seal { width:28px; height:28px; flex:none; display:block; }
.brand b { font:700 19px/1 var(--font-display); color:var(--color-ink-strong); letter-spacing:.01em; }
.brand b i { font-style:normal; color:var(--color-ink-muted); font-weight:500; }

/* ---------- 4. Headers ---------- */
.hdr { display:flex; align-items:center; gap:20px; padding:14px 32px;
  border-bottom:var(--border-hairline) solid var(--color-border); background:var(--color-surface); }
.hdr nav { margin-inline-start:auto; display:flex; align-items:center; gap:18px; font-size:14px; }
.hdr nav a { text-decoration:none; color:var(--color-ink-muted); }
.hdr nav a:hover { color:var(--color-ink-strong); }
.hdr nav a[aria-current] { color:var(--color-ink-strong); font-weight:500; }

/* theme toggle — 44px hit target on all header variants */
.theme-toggle { width:44px; height:44px; margin:-8px 0; display:inline-flex; align-items:center; justify-content:center;
  border:none; background:none; border-radius:var(--radius-2); color:var(--color-ink-muted); cursor:pointer; }
.theme-toggle:hover { background:var(--color-bg); color:var(--color-ink-strong); }
.theme-toggle svg { width:20px; height:20px; }

/* ---------- 5. Buttons ---------- */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap;
  min-height:44px; padding:0 20px; border-radius:var(--radius-2); cursor:pointer;
  font:500 15px/1 var(--font-ui); text-decoration:none; border:var(--border-hairline) solid transparent;
  transition:background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease); }
.btn-primary { background:var(--color-accent); color:var(--color-on-accent); }
.btn-primary:hover { background:var(--color-accent-hover); color:var(--color-on-accent); }
.btn-primary:active { background:var(--color-accent-active); }
.btn-secondary { background:var(--color-surface-raised); border-color:var(--color-border-strong); color:var(--color-ink); }
.btn-secondary:hover { border-color:var(--color-ink-faint); background:var(--color-surface); color:var(--color-ink-strong); }
.btn-ghost { background:none; color:var(--color-ink-muted); }
.btn-ghost:hover { background:var(--color-surface-raised); color:var(--color-ink-strong); }
.dark .btn-ghost:hover { background:var(--color-surface); }
.btn-danger { background:none; border-color:var(--color-danger); color:var(--color-danger); }
.btn-danger:hover { background:var(--color-danger-surface); }
.btn[disabled], .btn-disabled { background:transparent !important; border:var(--border-hairline) dashed var(--color-border-strong) !important;
  color:var(--color-ink-muted) !important; cursor:not-allowed; }
.btn-sm { min-height:36px; padding:0 14px; font-size:14px; }
.btn-block { width:100%; }
.btn .spin { width:14px; height:14px; border:2px solid currentColor; border-inline-end-color:transparent; border-radius:50%;
  animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(1turn); } }

/* ---------- 6. Cards, panels ---------- */
.card { background:var(--color-surface); border:var(--border-hairline) solid var(--color-border);
  border-radius:var(--radius-3); box-shadow:var(--shadow-1); }
.card-raised { background:var(--color-surface-raised); box-shadow:var(--shadow-2); }
.pad-5 { padding:var(--space-5); } .pad-6 { padding:var(--space-6); }

/* folded-corner sheet — used sparingly (trust notice, empty states) */
.sheet { position:relative; background:var(--color-surface-raised); border:var(--border-hairline) solid var(--color-border);
  border-radius:var(--radius-1); }
.sheet::after { content:""; position:absolute; top:0; inset-inline-end:0; width:0; height:0;
  border-block-start:16px solid var(--color-bg); border-inline-start:16px solid var(--color-border); border-end-start-radius:3px; }

/* ---------- 7. Stamp (the hanko — completion states only) ---------- */
.stamp { display:inline-flex; align-items:center; justify-content:center; padding:5px 14px;
  border:var(--border-emphasis) solid var(--color-accent); border-radius:var(--radius-2);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--color-accent) 45%, transparent);
  color:var(--color-accent); background:color-mix(in srgb, var(--color-accent) 7%, transparent);
  font:700 13px/1.5 var(--font-display); letter-spacing:.22em; text-transform:uppercase;
  transform:rotate(-4deg); white-space:nowrap; }
.stamp-sm { padding:2px 9px; font-size:10px; letter-spacing:.18em; border-width:1.5px; }

/* ---------- 8. Forms ---------- */
label { display:block; font:500 13px/1.5 var(--font-ui); color:var(--color-ink-muted); margin-block-end:6px; }
.input { width:100%; min-height:44px; padding:0 14px; font:400 15px/1.4 var(--font-ui);
  color:var(--color-ink); background:var(--color-surface-raised);
  border:var(--border-hairline) solid var(--color-border-strong); border-radius:var(--radius-2); }
.input::placeholder { color:var(--color-ink-faint); }
.input:hover { border-color:var(--color-ink-faint); }
.input:focus { outline:2px solid var(--color-focus); outline-offset:0; border-color:transparent; }
.input[disabled] { background:var(--color-bg); color:var(--color-ink-muted); border-style:dashed; }
.input-invalid { border-color:var(--color-danger); }
.field-hint { font-size:12.5px; color:var(--color-ink-faint); margin-block-start:5px; }
.field-error { font-size:13px; color:var(--color-danger); margin-block-start:5px; }
.input-wrap { position:relative; }
.input-wrap .input { padding-inline-end:48px; }
.input-eye { position:absolute; inset-block-start:0; inset-inline-end:0; width:44px; height:44px;
  display:flex; align-items:center; justify-content:center; background:none; border:none;
  color:var(--color-ink-faint); cursor:pointer; border-radius:var(--radius-2); }
.input-eye:hover { color:var(--color-ink); }
input[type=checkbox] { width:17px; height:17px; accent-color:var(--color-accent); }
input[type=range] { accent-color:var(--color-accent); }
input[type=color] { border:var(--border-hairline) solid var(--color-border-strong); border-radius:var(--radius-1); background:none; }

/* ---------- 9. Dropzone — paper laid on a desk ---------- */
.dropzone { display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
  padding:var(--space-7) var(--space-5); cursor:pointer;
  background:var(--color-surface-raised); border:var(--border-hairline) dashed var(--color-border-strong);
  border-radius:var(--radius-1); transition:border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease); }
.dropzone:hover { border-color:var(--color-ink-faint); }
.dropzone.dragging { border-color:var(--color-accent); border-style:solid; background:var(--color-accent-surface); }
.dropzone svg { width:36px; height:36px; color:var(--color-ink-faint); }
.dropzone .dz-prompt { font:500 15px/1.5 var(--font-ui); color:var(--color-ink); }
.dropzone .dz-hint { font-size:12.5px; color:var(--color-ink-faint); }

/* ---------- 10. Progress — the breath ---------- */
.breath { display:flex; align-items:center; gap:14px; }
.breath-dot { width:34px; height:34px; flex:none; border-radius:50%;
  border:var(--border-emphasis) solid var(--color-accent);
  animation:breathe 2.6s var(--ease) infinite; }
@keyframes breathe { 0%,100% { transform:scale(.82); opacity:.55; } 50% { transform:scale(1); opacity:1; } }
@media (prefers-reduced-motion:reduce) { .breath-dot,.btn .spin { animation:none; } }
.breath p { font:400 15px/1.5 var(--font-ui); color:var(--color-ink-muted); }
.meter { height:6px; border-radius:3px; background:var(--color-bg); border:var(--border-hairline) solid var(--color-border); overflow:hidden; }
.meter > i { display:block; height:100%; background:var(--color-accent); border-radius:3px; }

/* ---------- 11. Ad container — honest, bounded ---------- */
.ad-frame { border:var(--border-hairline) dashed var(--color-border-strong); border-radius:var(--radius-2);
  background:var(--color-ad-frame); padding:10px 12px 12px; }
.ad-frame .ad-label { font:500 10px/1 var(--font-ui); letter-spacing:.16em; text-transform:uppercase;
  color:var(--color-ink-faint); margin-block-end:8px; }
.ad-frame .ad-unit { display:flex; align-items:center; justify-content:center;
  border-radius:var(--radius-1); background:color-mix(in srgb, var(--color-ink) 4%, transparent);
  color:var(--color-ink-faint); font-size:12px; }

/* ---------- 12. Toasts, banners, badges ---------- */
.toast { display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:var(--radius-2);
  background:var(--color-surface-raised); border:var(--border-hairline) solid var(--color-border);
  border-inline-start:3px solid var(--color-ink-faint); box-shadow:var(--shadow-3); font-size:14px; max-width:360px; }
.toast-success { border-inline-start-color:var(--color-success); }
.toast-error { border-inline-start-color:var(--color-danger); }
.banner { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:9px 32px; font-size:13.5px;
  border-block-end:var(--border-hairline) solid var(--color-border); background:var(--color-surface); color:var(--color-ink-muted); }
.banner-info { background:var(--color-info-surface); color:var(--color-ink); }
.banner-warning { background:var(--color-warning-surface); color:var(--color-ink); }
.badge { display:inline-flex; align-items:center; white-space:nowrap; padding:2px 10px; border-radius:999px;
  font:500 12px/1.6 var(--font-ui); border:var(--border-hairline) solid var(--color-border-strong); color:var(--color-ink-muted); }
.badge-success { border-color:transparent; background:var(--color-success-surface); color:var(--color-success); }
.badge-danger { border-color:transparent; background:var(--color-danger-surface); color:var(--color-danger); }

/* ---------- 13. Tabs / segmented workspace nav ---------- */
.seg { display:flex; align-items:center; gap:2px; }
.seg button, .seg a { min-height:36px; padding:0 13px; display:inline-flex; align-items:center; white-space:nowrap; border:none; background:none;
  border-radius:var(--radius-2); font:400 13.5px/1 var(--font-ui); color:var(--color-ink-muted); cursor:pointer; text-decoration:none; }
.seg button:hover, .seg a:hover { color:var(--color-ink-strong); background:var(--color-bg); }
.seg [aria-selected=true] { background:var(--color-ink-strong); color:var(--color-bg); font-weight:500; }

/* ---------- 14. Tables ---------- */
.tbl { width:100%; border-collapse:collapse; font-size:14px; }
.tbl th { font:500 11.5px/1.4 var(--font-ui); letter-spacing:.1em; text-transform:uppercase;
  color:var(--color-ink-faint); text-align:start; padding:8px 0; }
.tbl td { padding:9px 0; border-block-start:var(--border-hairline) solid var(--color-border); color:var(--color-ink-muted); }
.tbl td:first-child { color:var(--color-ink); }

/* ---------- 15. Footer ---------- */
.ftr { border-block-start:var(--border-hairline) solid var(--color-border); padding:var(--space-5) 32px;
  text-align:center; font-size:12.5px; color:var(--color-ink-faint); }
.ftr a { color:var(--color-ink-muted); margin:0 10px; }
.ftr .ftr-fact { margin-block-start:10px; }

/* ---------- 16. Tool icons — 24px grid, 1.5 stroke ---------- */
.ti { width:24px; height:24px; stroke:currentColor; stroke-width:1.5; fill:none;
  stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ---------- 17. Layout helpers ---------- */
.wrap { max-width:1120px; margin-inline:auto; padding-inline:32px; }
.wrap-narrow { max-width:720px; margin-inline:auto; padding-inline:32px; }
.row { display:flex; align-items:center; gap:var(--space-3); }
.col { display:flex; flex-direction:column; gap:var(--space-3); }
.grow { flex:1; min-width:0; }

/* PDF page placeholders (mockup-only stand-ins for rendered pages) */
.page-thumb { aspect-ratio:3/4; background:#fff; border:var(--border-hairline) solid var(--color-border);
  border-radius:2px; box-shadow:0 1px 3px var(--color-page-shadow); position:relative; overflow:hidden; }
.dark .page-thumb { border-color:var(--night-500); }
.page-thumb i { position:absolute; inset-inline:12%; height:3px; border-radius:2px; background:#D9D2C0; }
.dark .page-thumb i { background:#C9C2B0; opacity:.85; }

/* phone frame for mobile artboards */
.phone { width:390px; margin:40px auto; background:var(--color-bg); border:var(--border-hairline) solid var(--color-border-strong);
  border-radius:14px; overflow:hidden; box-shadow:var(--shadow-3); }
.phone .hdr { padding:12px 16px; }
.phone .ftr { padding:20px 16px; }

</style>
</head>
<body>
<div style="display:flex; flex-direction:column; height:100vh; min-height:760px; min-width:1320px">
  <header class="hdr" style="padding:10px 20px; gap:14px">
    <a href="#/app/dashboard" aria-label="Back to documents" style="text-decoration:none; color:var(--color-ink-muted); font-size:18px">←</a>
    <svg style="width:20px;height:20px;flex:none" viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="var(--color-accent)"/><path d="M10.5 11h11l-11 10h11" fill="none" stroke="var(--color-on-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <button type="button" style="background:none; border:none; cursor:pointer; font:500 15px/1 var(--font-ui); color:var(--color-ink-strong); white-space:nowrap">lease-agreement</button>
    <span class="faint" style="font-size:12.5px">v3 · 12 pages</span>
    <nav style="gap:10px">
      <div class="seg" role="tablist" aria-label="Workspace tools">
        <button role="tab" aria-selected="false">View</button>
        <button role="tab" aria-selected="false">Organize</button>
        <button role="tab" aria-selected="false">Edit</button>
        <button role="tab" aria-selected="true">Annotate</button>
        <button role="tab" aria-selected="false">Forms</button>
        <button role="tab" aria-selected="false">Convert</button>
        <button role="tab" aria-selected="false">Compare</button>
        <button role="tab" aria-selected="false">Sign</button>
        <button role="tab" aria-selected="false">Protect</button>
      </div>
      <span style="width:1px; height:20px; background:var(--color-border)"></span>
      <button class="btn btn-sm btn-ghost" type="button">Split</button>
      <button class="btn btn-sm btn-ghost" type="button">Compress</button>
      <button class="btn btn-sm btn-secondary" type="button">Download</button>
      <button class="theme-toggle" type="button" aria-label="Theme: System — change theme"><svg class="ti" viewBox="0 0 24 24" style="width:20px;height:20px"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M9 21h6M12 17v4"/></svg></button>
    </nav>
  </header>

  <div style="display:flex; flex:1; min-height:0">
    <aside style="width:212px; flex:none; overflow-y:auto; border-inline-end:1px solid var(--color-border); background:var(--color-surface); padding:14px; display:flex; flex-direction:column; gap:18px">
      <div>
        <p class="kicker" style="margin-bottom:8px">Tools</p>
        <div class="pal">
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l12 7-5.5 1.5L10 18 6 4Z"/></svg>Select</button>
          <button type="button" aria-pressed="true" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13 12.5 5.5l3 3L8 16H5v-3Z"/><path d="M4 19h13"/></svg>Highlight</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v6.5a5 5 0 0 0 10 0V4.5"/><path d="M6 20h12"/></svg>Underline</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6a5 5 0 0 0-8 0c-1.5 2 .5 3.5 4 4.5"/><path d="M8 18a5 5 0 0 0 8 0c1.4-1.9-.3-3.4-3.5-4.4"/><path d="M4 12h16"/></svg>Strike</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 13c1.7-2.5 3.3-2.5 5 0s3.3 2.5 5 0 3.3-2.5 5 0"/></svg>Squiggly</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H12l-4.5 4v-4H5.5A1.5 1.5 0 0 1 4 14.5v-9Z"/></svg>Note</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4.5h14V6M12 4.5v15M9.5 19.5h5"/></svg>Text box</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>Rect</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>Ellipse</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 19 14-14"/></svg>Line</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 19 13-13M18 11V6h-5"/></svg>Arrow</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 8 6-3 9H7l-3-9 8-6Z"/></svg>Polygon</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 17 5-8 4 5 7-10"/></svg>Polyline</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17c3-6 5.5-7 6.5-6s-2 5.5-.5 6 3-2.5 4.5-2 1 2.5 5.5 2"/></svg>Draw</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 10c-.8-1.3-1.2-2.4-1.2-3.5a4.2 4.2 0 0 1 8.4 0c0 1.1-.4 2.2-1.2 3.5l-.6 1h-4.8l-.6-1Z"/><path d="M5 15.5A1.5 1.5 0 0 1 6.5 14h11a1.5 1.5 0 0 1 1.5 1.5V18H5v-2.5Z"/><path d="M5 21h14"/></svg>Stamp</button>
          <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v12a2 2 0 0 0 2 2h12M3 7h12a2 2 0 0 1 2 2v12"/></svg>Crop</button>
        </div>
      </div>
      <div>
        <label for="annot-colour">Colour</label>
        <input id="annot-colour" type="color" value="#E8C34A" style="width:100%; height:34px; cursor:pointer" />
      </div>
      <div>
        <label for="annot-width">Line width — 3</label>
        <input id="annot-width" type="range" min="1" max="12" value="3" style="width:100%" />
      </div>
      <div>
        <label for="annot-opacity">Opacity — 60%</label>
        <input id="annot-opacity" type="range" min="10" max="100" value="60" style="width:100%" />
      </div>
      <div>
        <label for="annot-stamp">Custom stamp</label>
        <input id="annot-stamp" type="file" style="font-size:11.5px; width:100%" />
      </div>
    </aside>

    <main style="flex:1; min-width:0; display:flex; flex-direction:column">
      <div class="row" style="padding:8px 20px; border-block-end:1px solid var(--color-border); background:var(--color-surface); font-size:13.5px">
        <button class="btn btn-sm btn-ghost" type="button" aria-label="Previous page">‹</button>
        <span class="muted">Page 2 / 12</span>
        <button class="btn btn-sm btn-ghost" type="button" aria-label="Next page">›</button>
        <span style="width:1px; height:18px; background:var(--color-border); margin-inline:8px"></span>
        <button class="btn btn-sm btn-ghost" type="button" aria-label="Zoom out">−</button>
        <span class="faint" style="font-size:12.5px">100%</span>
        <button class="btn btn-sm btn-ghost" type="button" aria-label="Zoom in">+</button>
        <span style="margin-inline-start:auto"></span>
        <span class="badge">2 unsaved</span>
        <button class="btn btn-sm btn-primary" type="button">Save</button>
        <button class="btn btn-sm btn-secondary" type="button">Flatten</button>
      </div>
      <div style="flex:1; overflow:auto; background:var(--color-canvas-backdrop); padding:36px; display:flex; justify-content:center">
        <div style="width:560px; flex:none">
          <div class="page-thumb" style="aspect-ratio:8.5/11; border-radius:3px; box-shadow:0 4px 16px var(--color-page-shadow)">
            <i style="top:9%"></i><i style="top:13%; inset-inline-end:30%"></i><i style="top:17%"></i><i style="top:21%; inset-inline-end:22%"></i>
            <span style="position:absolute; top:26%; inset-inline-start:12%; width:44%; height:3.4%; background:rgba(232,195,74,.55); border-radius:2px"></span>
            <i style="top:33%"></i><i style="top:37%; inset-inline-end:40%"></i>
            <span style="position:absolute; top:44%; inset-inline-start:12%; width:26px; height:26px; border-radius:6px; background:var(--color-accent); color:#FFFDF7; display:flex; align-items:center; justify-content:center; font-size:13px; box-shadow:var(--shadow-2)">✎</span>
            <i style="top:55%"></i><i style="top:59%"></i><i style="top:63%; inset-inline-end:35%"></i>
            <svg viewBox="0 0 200 40" style="position:absolute; top:72%; inset-inline-start:12%; width:40%; overflow:visible"><path d="M4 30 C 30 4, 60 38, 90 18 S 150 8, 196 24" fill="none" stroke="#B23A26" stroke-width="2.5" stroke-linecap="round"/></svg>
            <i style="top:88%; inset-inline-end:50%"></i>
          </div>
        </div>
      </div>
    </main>

    <aside style="width:248px; flex:none; display:flex; flex-direction:column; border-inline-start:1px solid var(--color-border); background:var(--color-surface)">
      <div class="row" style="padding:12px 14px; border-block-end:1px solid var(--color-border)">
        <span style="font:500 14px/1 var(--font-ui)">Comments <span class="faint">(3)</span></span>
        <span class="grow"></span>
        <button class="btn btn-sm btn-ghost" type="button" style="min-height:32px; padding:0 10px; font-size:12px">Clear page</button>
        <button class="btn btn-sm btn-ghost" type="button" style="min-height:32px; padding:0 10px; font-size:12px; color:var(--color-danger)">Clear all</button>
      </div>
      <div style="flex:1; overflow-y:auto; padding:10px 12px">
        <p class="kicker" style="margin:4px 2px 8px">Page 2</p>
        <div class="comment-row on">
          <p><b>You</b> <span class="faint">highlight · 2 min ago</span></p>
          <p class="muted">“monthly rent of $2,150”</p>
          <div class="row" style="gap:10px; font-size:12px; margin-top:4px"><a href="#edit">Edit</a><a href="#delete" style="color:var(--color-danger)">Delete</a></div>
        </div>
        <div class="comment-row">
          <p><b>You</b> <span class="faint">note · 9 min ago</span></p>
          <p class="muted">Check the deposit clause against the addendum.</p>
          <div class="row" style="gap:10px; font-size:12px; margin-top:4px"><a href="#edit">Edit</a><a href="#delete" style="color:var(--color-danger)">Delete</a></div>
        </div>
        <div class="comment-row">
          <p><b>You</b> <span class="faint">draw · 12 min ago</span></p>
          <p class="muted">Freehand mark near the signature line.</p>
          <div class="row" style="gap:10px; font-size:12px; margin-top:4px"><a href="#edit">Edit</a><a href="#delete" style="color:var(--color-danger)">Delete</a></div>
        </div>
      </div>
    </aside>
  </div>
</div>

<style>
  .pal { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  .pal button { display:flex; align-items:center; gap:7px; padding:7px 8px; font:400 12.5px/1 var(--font-ui);
    background:none; border:1px solid var(--color-border); border-radius:var(--radius-2); color:var(--color-ink-muted); cursor:pointer; }
  .pal button:hover { color:var(--color-ink-strong); border-color:var(--color-border-strong); }
  .pal button.on { background:var(--color-ink-strong); border-color:var(--color-ink-strong); color:var(--color-bg); }
  .pal svg { width:15px; height:15px; stroke:currentColor; stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .comment-row { border:1px solid var(--color-border); border-radius:var(--radius-2); padding:9px 10px; font-size:12.5px; margin-bottom:8px; }
  .comment-row.on { border-color:var(--color-accent); }
  .comment-row b { font-weight:500; color:var(--color-ink-strong); }
  .btn-sm.btn-primary { min-height:32px; }
  .btn-sm.btn-secondary { min-height:32px; }
</style>

</body>
</html>
